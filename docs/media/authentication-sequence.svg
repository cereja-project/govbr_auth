<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Sequência de autenticação OAuth OIDC</title>
  <desc id="desc">O navegador inicia o login, o backend controla state, PKCE e nonce, valida o token e consulta userinfo.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167a72"/></marker>
    <marker id="arrowBack" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9 0L0 4.5L9 9Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="740" rx="24" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif">
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="70" y="38" width="250" height="60" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="195" y="76" fill="#0f172a">Navegador</text>
      <rect x="475" y="38" width="250" height="60" rx="14" fill="#0f2f3a" stroke="#2dd4bf" stroke-width="2"/><text x="600" y="76" fill="#f8fafc">API + govbr-auth</text>
      <rect x="880" y="38" width="250" height="60" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="1005" y="76" fill="#115e59">Provedor</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"><path d="M195 112V700"/><path d="M600 112V700"/><path d="M1005 112V700"/></g>
    <g font-size="15" fill="#334155">
      <path d="M195 142H590" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="392" y="132" text-anchor="middle">1. GET /auth/govbr/login</text>
      <rect x="486" y="166" width="228" height="58" rx="12" fill="#e6fffb" stroke="#5eead4"/><text x="600" y="190" text-anchor="middle" font-weight="700">state + nonce + PKCE</text><text x="600" y="211" text-anchor="middle">cifrados no state</text>
      <path d="M590 252H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="398" y="242" text-anchor="middle">2. redirect /authorize</text>
      <path d="M195 290H995" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="280" text-anchor="middle">3. login e consentimento</text>
      <path d="M995 326H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="750" y="316" text-anchor="middle">4. 302 Location: callback</text>
      <path d="M195 366H590" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="392" y="356" text-anchor="middle">GET callback?code&amp;state</text>
      <path d="M600 408H995" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="398" text-anchor="middle">5. POST /token + code_verifier</text>
      <path d="M995 448H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="438" text-anchor="middle">access token + ID token</text>
      <path d="M600 484H995" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="474" text-anchor="middle">6. GET /jwk</text>
      <path d="M995 520H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="510" text-anchor="middle">chaves públicas</text>
      <rect x="480" y="538" width="240" height="58" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="600" y="562" text-anchor="middle" font-weight="700">validação local</text><text x="600" y="584" text-anchor="middle">assinatura · iss · aud · nonce · sub</text>
      <path d="M600 620H995" stroke="#167a72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="610" text-anchor="middle">7. GET /userinfo</text>
      <path d="M995 658H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="648" text-anchor="middle">claims do usuário</text>
      <path d="M590 700H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="398" y="690" text-anchor="middle">8. resultado autenticado</text>
    </g>
  </g>
</svg>
