<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Cinco opções de símbolo para govbr-auth</title>
  <desc id="desc">Prancha exploratória com cinco direções de logo, mantendo as cores verde, vermelho, vinho e grafite do projeto.</desc>
  <rect width="1200" height="960" fill="#f8fafc"/>
  <text x="60" y="72" fill="#111827" font-family="Inter, sans-serif" font-size="34" font-weight="750">govbr-auth · cinco direções de símbolo</text>
  <text x="60" y="108" fill="#64748b" font-family="Inter, sans-serif" font-size="18">Exploratórias — a paleta atual foi preservada; o lettering não está sendo avaliado nesta etapa.</text>

  <g transform="translate(60 150)">
    <rect width="320" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="48" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">01 · Ponte</text>
    <g transform="translate(112 76)">
      <path d="M 14 115 V 108 C 14 79.716 20.716 73 29 73 H 35 C 43.284 73 50 79.716 50 108 V 115" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <circle cx="14" cy="115" r="7" fill="#10b981"/><circle cx="32" cy="73" r="7" fill="#10b981"/><circle cx="50" cy="115" r="7" fill="#10b981"/>
      <rect x="10" y="122" width="25" height="19" rx="9.5" fill="#ef4444"/><rect x="29" y="122" width="25" height="19" rx="9.5" fill="#991b1b"/>
    </g>
    <text x="28" y="278" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="700">govbr-auth</text>
    <text x="28" y="306" fill="#64748b" font-family="Inter, sans-serif" font-size="16">confiança conectada</text>
  </g>

  <g transform="translate(440 150)">
    <rect width="320" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="48" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">02 · Escudo</text>
    <g transform="translate(102 72)">
      <path d="M58 12 108 31v39c0 35-22 59-50 72C30 129 8 105 8 70V31z" fill="#111827" stroke="#10b981" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="43" cy="70" r="19" fill="#ef4444"/><circle cx="73" cy="70" r="19" fill="#991b1b"/>
      <path d="M58 35v22" stroke="#10b981" stroke-width="8" stroke-linecap="round"/><circle cx="58" cy="35" r="6" fill="#10b981"/>
    </g>
    <text x="28" y="278" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="700">govbr-auth</text>
    <text x="28" y="306" fill="#64748b" font-family="Inter, sans-serif" font-size="16">segurança verificável</text>
  </g>

  <g transform="translate(820 150)">
    <rect width="320" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="48" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">03 · Elo</text>
    <g transform="translate(88 85)" fill="none" stroke-linecap="round">
      <rect x="2" y="36" width="78" height="54" rx="27" stroke="#10b981" stroke-width="10"/>
      <rect x="62" y="36" width="78" height="54" rx="27" stroke="#10b981" stroke-width="10"/>
      <circle cx="31" cy="63" r="11" fill="#ef4444" stroke="none"/><circle cx="111" cy="63" r="11" fill="#991b1b" stroke="none"/>
    </g>
    <text x="28" y="278" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="700">govbr-auth</text>
    <text x="28" y="306" fill="#64748b" font-family="Inter, sans-serif" font-size="16">integração entre sistemas</text>
  </g>

  <g transform="translate(250 530)">
    <rect width="320" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="48" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">04 · Monograma</text>
    <g transform="translate(91 78)">
      <path d="M42 28H95L67 61 95 94H42" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M42 28 14 61l28 33" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="34" y="49" width="25" height="25" rx="8" fill="#ef4444"/><rect x="59" y="49" width="25" height="25" rx="8" fill="#991b1b"/>
    </g>
    <text x="28" y="278" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="700">govbr-auth</text>
    <text x="28" y="306" fill="#64748b" font-family="Inter, sans-serif" font-size="16">identidade proprietária</text>
  </g>

  <g transform="translate(630 530)">
    <rect width="320" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="48" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">05 · Handshake</text>
    <g transform="translate(82 77)">
      <path d="M14 78 48 44l29 29" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m138 78-34-34-29 29" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="5" y="80" width="58" height="34" rx="17" fill="#ef4444"/><rect x="89" y="80" width="58" height="34" rx="17" fill="#991b1b"/>
      <path d="M63 92h26" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="28" y="278" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="700">govbr-auth</text>
    <text x="28" y="306" fill="#64748b" font-family="Inter, sans-serif" font-size="16">acordo validado</text>
  </g>

  <text x="60" y="918" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Critério comum: leitura em escala pequena, vínculo com autenticação e distância da marca oficial gov.br.</text>
</svg>
