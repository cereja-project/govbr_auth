<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Jornada local com FakeGov</title>
  <desc id="desc">Quatro etapas: instalar, iniciar, entrar e concluir o fluxo OAuth OIDC local.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d1fae5"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#111827"/>
  <text x="64" y="68" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">FakeGov: autenticação completa, sem depender do ambiente oficial</text>
  <text x="64" y="104" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="18">Mesmo código consumidor. Provedor local, dados fictícios e fluxo OAuth/OIDC realista.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(64 150)">
      <rect width="220" height="190" rx="18" fill="#111827" stroke="#d1fae5" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#10b981"/><text x="36" y="44" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">1</text>
      <text x="24" y="88" fill="#f8fafc" font-size="25" font-weight="700">Instalar</text>
      <text x="24" y="124" fill="#e2e8f0" font-size="16">Extra do framework</text>
      <text x="24" y="150" fill="#d1fae5" font-size="15">govbr-auth[...,fake]</text>
    </g>
    <path d="M296 245H340" stroke="#d1fae5" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(352 150)">
      <rect width="220" height="190" rx="18" fill="#111827" stroke="#d1fae5" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#10b981"/><text x="36" y="44" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">2</text>
      <text x="24" y="88" fill="#f8fafc" font-size="25" font-weight="700">Iniciar</text>
      <text x="24" y="124" fill="#e2e8f0" font-size="16">GOVBR_PROVIDER=fake</text>
      <text x="24" y="150" fill="#d1fae5" font-size="15">loopback por padrão</text>
    </g>
    <path d="M584 245H628" stroke="#d1fae5" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(640 150)">
      <rect width="220" height="190" rx="18" fill="#111827" stroke="#d1fae5" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#10b981"/><text x="36" y="44" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">3</text>
      <text x="24" y="88" fill="#f8fafc" font-size="25" font-weight="700">Entrar</text>
      <text x="24" y="124" fill="#e2e8f0" font-size="16">Credenciais fictícias</text>
      <text x="24" y="150" fill="#d1fae5" font-size="15">login e consentimento</text>
    </g>
    <path d="M872 245H916" stroke="#d1fae5" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(928 150)">
      <rect width="220" height="190" rx="18" fill="#0f172a" stroke="#d1fae5" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#10b981"/><text x="36" y="44" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">4</text>
      <text x="24" y="88" fill="#f8fafc" font-size="25" font-weight="700">Concluir</text>
      <text x="24" y="124" fill="#d1fae5" font-size="16">Callback validado</text>
      <text x="24" y="150" fill="#d1fae5" font-size="15">sem expor tokens</text>
    </g>
  </g>
  <text x="64" y="386" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="16">OAuth 2.0 · PKCE · OpenID Connect · JWKS · userinfo</text>
</svg>
