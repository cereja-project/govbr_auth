<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Sequência animada de autenticação OAuth OIDC</title>
  <desc id="desc">O navegador inicia o login, o backend controla state, PKCE e nonce, valida o token e consulta userinfo. Um marcador verde percorre as doze setas das oito etapas, em um ciclo de 24 segundos. Com movimento reduzido, o diagrama permanece estático e completo.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker>
    <marker id="arrowBack" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      .phase {
        opacity: 1;
      }
      .packet {
        opacity: 0;
        fill: #10b981;
        stroke: #111827;
        stroke-width: 2;
        pointer-events: none;
        animation: packet-travel 24s linear infinite;
        animation-delay: var(--delay);
      }
      /* Cada seta ocupa 2s: 1.8s de percurso e 0.2s de intervalo. */
      @keyframes packet-travel {
        0% { opacity: 0; transform: translateX(0); }
        0.5% { opacity: 1; }
        7% { opacity: 1; }
        7.5%, 100% { opacity: 0; transform: translateX(var(--travel)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .phase { opacity: 1; animation: none; }
        .packet { animation: none; display: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="740" rx="24" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif">
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="70" y="38" width="250" height="60" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="195" y="76" fill="#0f172a">Navegador</text>
      <rect x="475" y="38" width="250" height="60" rx="14" fill="#111827" stroke="#d1fae5" stroke-width="2"/><text x="600" y="76" fill="#f8fafc">API + govbr-auth</text>
      <rect x="880" y="38" width="250" height="60" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1005" y="76" fill="#0f172a">Provedor</text>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 7"><path d="M195 112V700"/><path d="M600 112V700"/><path d="M1005 112V700"/></g>
    <g font-size="15" fill="#0f172a">
      <g id="phase-1" class="phase">
        <path d="M195 142H590" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="392" y="132" text-anchor="middle">1. GET /auth/govbr/login</text>
        <circle class="packet" cx="195" cy="142" r="6" aria-hidden="true" style="--travel: 395px; --delay: 0s"/>
        <rect x="486" y="166" width="228" height="58" rx="12" fill="#d1fae5" stroke="#10b981"/><text x="600" y="190" text-anchor="middle" font-weight="700">state + nonce + PKCE</text><text x="600" y="211" text-anchor="middle">cifrados no state</text>
      </g>
      <g id="phase-2" class="phase">
        <path d="M590 252H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="398" y="242" text-anchor="middle">2. redirect /authorize</text>
        <circle class="packet" cx="590" cy="252" r="6" aria-hidden="true" style="--travel: -385px; --delay: 2s"/>
      </g>
      <g id="phase-3" class="phase">
        <path d="M195 290H995" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="280" text-anchor="middle">3. login e consentimento</text>
        <circle class="packet" cx="195" cy="290" r="6" aria-hidden="true" style="--travel: 800px; --delay: 4s"/>
      </g>
      <g id="phase-4" class="phase">
        <path d="M995 326H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="750" y="316" text-anchor="middle">4. 302 Location: callback</text>
        <circle class="packet" cx="995" cy="326" r="6" aria-hidden="true" style="--travel: -790px; --delay: 6s"/>
        <path d="M195 366H590" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="392" y="356" text-anchor="middle">GET callback?code&amp;state</text>
        <circle class="packet" cx="195" cy="366" r="6" aria-hidden="true" style="--travel: 395px; --delay: 8s"/>
      </g>
      <g id="phase-5" class="phase">
        <path d="M600 408H995" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="398" text-anchor="middle">5. POST /token + code_verifier</text>
        <circle class="packet" cx="600" cy="408" r="6" aria-hidden="true" style="--travel: 395px; --delay: 10s"/>
        <path d="M995 448H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="438" text-anchor="middle">access token + ID token</text>
        <circle class="packet" cx="995" cy="448" r="6" aria-hidden="true" style="--travel: -385px; --delay: 12s"/>
      </g>
      <g id="phase-6" class="phase">
        <path d="M600 484H995" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="474" text-anchor="middle">6. GET /jwk</text>
        <circle class="packet" cx="600" cy="484" r="6" aria-hidden="true" style="--travel: 395px; --delay: 14s"/>
        <path d="M995 520H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="510" text-anchor="middle">chaves públicas</text>
        <circle class="packet" cx="995" cy="520" r="6" aria-hidden="true" style="--travel: -385px; --delay: 16s"/>
        <rect x="480" y="538" width="240" height="58" rx="12" fill="#d1fae5" stroke="#10b981"/><text x="600" y="562" text-anchor="middle" font-weight="700">validação local</text><text x="600" y="584" text-anchor="middle">assinatura · iss · aud · nonce · sub</text>
      </g>
      <g id="phase-7" class="phase">
        <path d="M600 620H995" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="798" y="610" text-anchor="middle">7. GET /userinfo</text>
        <circle class="packet" cx="600" cy="620" r="6" aria-hidden="true" style="--travel: 395px; --delay: 18s"/>
        <path d="M995 658H610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="802" y="648" text-anchor="middle">claims do usuário</text>
        <circle class="packet" cx="995" cy="658" r="6" aria-hidden="true" style="--travel: -385px; --delay: 20s"/>
      </g>
      <g id="phase-8" class="phase">
        <path d="M590 700H205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowBack)"/><text x="398" y="690" text-anchor="middle">8. resultado autenticado</text>
        <circle class="packet" cx="590" cy="700" r="6" aria-hidden="true" style="--travel: -385px; --delay: 22s"/>
      </g>
    </g>
  </g>
</svg>
