<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Seis conceitos avançados de símbolo para govbr-auth</title>
  <desc id="desc">Prancha com duas opções de ponte, duas de elo e duas de handshake, combinando nós, sobreposição de sistemas e circuitos.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <text x="60" y="68" fill="#111827" font-family="Inter, sans-serif" font-size="34" font-weight="750">govbr-auth · integração / OAuth</text>
  <text x="60" y="104" fill="#64748b" font-family="Inter, sans-serif" font-size="18">Seis conceitos com construção mais proprietária: nós, interseção, circuito e conexão lógica.</text>

  <g transform="translate(60 150)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">PONTE 01 · circuito de confiança</text>
    <g transform="translate(110 72)">
      <path d="M30 128V92h72l36-54 36 54h72v36" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="128" r="12" fill="#ef4444"/><circle cx="246" cy="128" r="12" fill="#991b1b"/>
      <circle cx="138" cy="38" r="12" fill="#10b981"/>
      <path d="M102 145h72" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
      <circle cx="138" cy="145" r="9" fill="#10b981"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Rotas independentes convergem em um nó validado.</text>
  </g>

  <g transform="translate(620 150)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">PONTE 02 · passagem OAuth</text>
    <g transform="translate(105 69)">
      <circle cx="88" cy="80" r="58" fill="none" stroke="#ef4444" stroke-width="12"/>
      <circle cx="182" cy="80" r="58" fill="none" stroke="#991b1b" stroke-width="12"/>
      <path d="M28 80h52M190 80h52M135 22v-18M135 156v18" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
      <circle cx="135" cy="80" r="17" fill="#10b981"/>
      <path d="m128 80 6 6 12-14" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Dois sistemas distintos compartilham uma interseção segura.</text>
  </g>

  <g transform="translate(60 490)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">ELO 01 · cadeia modular</text>
    <g transform="translate(102 77)" fill="none" stroke-linecap="round">
      <path d="M20 84c0-32 26-58 58-58h33c32 0 58 26 58 58s-26 58-58 58H78c-32 0-58-26-58-58Z" stroke="#10b981" stroke-width="11"/>
      <path d="M138 84c0-32 26-58 58-58h33c32 0 58 26 58 58s-26 58-58 58h-33c-32 0-58-26-58-58Z" stroke="#10b981" stroke-width="11"/>
      <circle cx="77" cy="84" r="12" fill="#ef4444" stroke="none"/><circle cx="253" cy="84" r="12" fill="#991b1b" stroke="none"/>
      <path d="M118 84h40" stroke="#111827" stroke-width="8"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">O vínculo continua legível mesmo sem depender de texto.</text>
  </g>

  <g transform="translate(620 490)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">ELO 02 · token compartilhado</text>
    <g transform="translate(119 71)">
      <path d="M78 16h78l58 58-58 58H78L20 74z" fill="#111827" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="78" cy="74" r="22" fill="#ef4444"/><circle cx="156" cy="74" r="22" fill="#991b1b"/>
      <path d="M117 28v-16M117 134v16M20 74H4M230 74h16" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
      <circle cx="117" cy="28" r="7" fill="#10b981"/><circle cx="117" cy="120" r="7" fill="#10b981"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">A união vira um token central, técnico e memorável.</text>
  </g>

  <g transform="translate(60 830)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">HANDSHAKE 01 · convergência</text>
    <g transform="translate(102 75)">
      <path d="M10 116 66 60h58l26 26 26-26h58l56 56" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M66 60V28M234 60V28" stroke="#10b981" stroke-width="11" stroke-linecap="round"/>
      <circle cx="66" cy="28" r="12" fill="#ef4444"/><circle cx="234" cy="28" r="12" fill="#991b1b"/>
      <path d="M72 133h96" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="133" r="10" fill="#10b981"/><circle cx="168" cy="133" r="10" fill="#10b981"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Dois agentes chegam ao mesmo ponto de validação.</text>
  </g>

  <g transform="translate(620 830)">
    <rect width="520" height="300" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="46" fill="#111827" font-family="Inter, sans-serif" font-size="18" font-weight="700">HANDSHAKE 02 · plug lógico</text>
    <g transform="translate(103 70)">
      <path d="M18 87h55l28-28h44l28 28h55" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="87" width="82" height="52" rx="18" fill="#ef4444"/>
      <rect x="168" y="87" width="82" height="52" rx="18" fill="#991b1b"/>
      <path d="M100 113h68" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
      <circle cx="101" cy="113" r="9" fill="#10b981"/><circle cx="167" cy="113" r="9" fill="#10b981"/>
      <path d="M101 59V34M167 59V34" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
      <circle cx="101" cy="34" r="10" fill="#ef4444"/><circle cx="167" cy="34" r="10" fill="#991b1b"/>
    </g>
    <text x="30" y="268" fill="#64748b" font-family="Inter, sans-serif" font-size="16">A conexão tem encaixe, polaridade e presença de produto técnico.</text>
  </g>

  <text x="60" y="1170" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Paleta preservada nesta rodada. A troca de cor só será testada se uma direção escolhida exigir outro contraste ou posicionamento.</text>
</svg>
