    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Handshake A · encontro</text>
    <path d="M84 150 132 102l38 38 38-38 48 48" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="155" width="94" height="40" rx="20" fill="#ef4444"/><rect x="168" y="155" width="94" height="40" rx="20" fill="#991b1b"/>
    <path d="M150 175h40" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
