    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Elo C · módulos</text>
    <rect x="82" y="76" width="80" height="80" rx="20" fill="#ef4444"/>
    <rect x="178" y="104" width="80" height="80" rx="20" fill="#991b1b"/>
