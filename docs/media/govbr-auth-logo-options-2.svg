    <rect width="340" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Handshake B · encaixe</text>
    <path d="M88 145 128 105h46l22 22 22-22h46l40 40" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
