    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Handshake C · assinatura</text>
    <path d="M92 151 130 113h35l27 27 27-27h35l38 38" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
