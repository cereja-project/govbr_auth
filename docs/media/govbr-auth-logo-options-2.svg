<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">Nove variações de ponte, elo e handshake para govbr-auth</title>
  <desc id="desc">Prancha exploratória com três variações de ponte, três de elo e três de handshake, usando a paleta atual do projeto.</desc>
  <rect width="1200" height="1050" fill="#f8fafc"/>
  <text x="60" y="66" fill="#111827" font-family="Inter, sans-serif" font-size="32" font-weight="750">govbr-auth · ponte, elo e handshake</text>
  <text x="60" y="100" fill="#64748b" font-family="Inter, sans-serif" font-size="17">Nove variações de símbolo para comparar estrutura, legibilidade e personalidade.</text>

  <g transform="translate(60 140)">
    <rect width="340" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Ponte A · arco</text>
    <path d="M90 148V120c0-42 34-76 76-76h8c42 0 76 34 76 76v28" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round"/>
    <circle cx="90" cy="148" r="9" fill="#10b981"/><circle cx="170" cy="44" r="9" fill="#10b981"/><circle cx="250" cy="148" r="9" fill="#10b981"/>
    <rect x="82" y="158" width="88" height="45" rx="22" fill="#ef4444"/><rect x="170" y="158" width="88" height="45" rx="22" fill="#991b1b"/>
  </g>

  <g transform="translate(430 140)">
    <rect width="340" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Ponte B · canal</text>
    <path d="M90 144h42l38-62 38 62h42" fill="none" stroke="#10b981" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="90" cy="144" r="9" fill="#10b981"/><circle cx="170" cy="82" r="9" fill="#10b981"/><circle cx="250" cy="144" r="9" fill="#10b981"/>
    <rect x="82" y="158" width="88" height="45" rx="22" fill="#ef4444"/><rect x="170" y="158" width="88" height="45" rx="22" fill="#991b1b"/>
  </g>

  <g transform="translate(800 140)">
    <rect width="340" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="40" fill="#111827" font-family="Inter, sans-serif" font-size="17" font-weight="700">Ponte C · gateway</text>
    <path d="M90 155V105h80v50h80v-50" fill="none" stroke="#10b981" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="90" cy="155" r="9" fill="#10b981"/><circle cx="170" cy="105" r="9" fill="#10b981"/><circle cx="250" cy="155" r="9" fill="#10b981"/>
    <rect x="82" y="165" width="88" height="38" rx="19" fill="#ef4444"/><rect x="170" y="165" width="88" height="38" rx="19" fill="#991b1b"/>
