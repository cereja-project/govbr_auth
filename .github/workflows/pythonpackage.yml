name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Formatting
        run: python -m black --check govbr_auth tests examples scripts
      - name: Blocking lint
        run: python -m flake8 govbr_auth tests examples scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Coverage gate
        run: >-
          python -m pytest --tb=short --disable-warnings -q
          --cov=govbr_auth --cov-branch --cov-report=term-missing
          --cov-fail-under=90
          --basetemp="${{ runner.temp }}/govbr-auth-pytest"
          -o cache_dir="${{ runner.temp }}/govbr-auth-cache"
      - run: git diff --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test supported environment
        run: >-
          python -m pytest --tb=short --disable-warnings -q
          --basetemp="${{ runner.temp }}/govbr-auth-pytest"
          -o cache_dir="${{ runner.temp }}/govbr-auth-cache"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist/*.whl
