name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -r docs/requirements-docs.txt
      - run: python -m build
      - name: Install built wheel for documentation
        shell: bash
        run: |
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install "${wheel_path}[fake]"
      - name: Smoke-test installed fake provider
        shell: bash
        run: |
          python -m venv /tmp/govbr-auth-demo
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          /tmp/govbr-auth-demo/bin/python -m pip install "${wheel_path}[fake]"
          cd /tmp
          /tmp/govbr-auth-demo/bin/python -c \
            "import govbr_auth, pathlib; assert pathlib.Path(govbr_auth.__file__).is_relative_to('/tmp/govbr-auth-demo')"
          /tmp/govbr-auth-demo/bin/python -m govbr_auth.fake > /tmp/govbr-auth-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/jwk | grep -q '"keys"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/govbr-auth-demo.log
          exit 1
      - run: python -m sphinx -W -b html docs _build/html
      - run: python -m sphinx -W -b linkcheck docs _build/linkcheck
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _build/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
