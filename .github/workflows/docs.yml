name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -r docs/requirements-docs.txt
      - name: Build distributions outside the checkout
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/source"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          python -m build --outdir "$RUNNER_TEMP/dist" "$source_dir"
      - name: Install built wheel for documentation
        shell: bash
        run: |
          wheel_path="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install "${wheel_path}[fake,django,flask]"
      - name: Smoke-test installed fake provider
        shell: bash
        run: |
          python -m venv /tmp/govbr-auth-demo
          wheel_path="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          /tmp/govbr-auth-demo/bin/python -m pip install "${wheel_path}[fake]"
          cd /tmp
          /tmp/govbr-auth-demo/bin/python -c \
            "import govbr_auth, pathlib; assert pathlib.Path(govbr_auth.__file__).is_relative_to('/tmp/govbr-auth-demo')"
          /tmp/govbr-auth-demo/bin/python -m govbr_auth.fake > /tmp/govbr-auth-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/fake-govbr/jwk | grep -q '"keys"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/govbr-auth-demo.log
          exit 1
      - name: Build HTML from the installed wheel
        working-directory: ${{ runner.temp }}
        run: >-
          python -m sphinx -W -b html
          "${{ github.workspace }}/docs"
          "${{ runner.temp }}/docs-html"
      - name: Check documentation links from the installed wheel
        working-directory: ${{ runner.temp }}
        run: >-
          python -m sphinx -W -b linkcheck
          "${{ github.workspace }}/docs"
          "${{ runner.temp }}/docs-linkcheck"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: ${{ runner.temp }}/docs-html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
