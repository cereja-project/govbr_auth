name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: ${{ runner.temp }}/govbr-auth.coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify release tag and production ancestry
        shell: bash
        run: |
          expected_tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify source at the released commit
        run: >-
          python -m pytest --tb=short --disable-warnings -q
          --cov=govbr_auth --cov-branch --cov-report=term-missing
          --cov-fail-under=90
          --basetemp="${{ runner.temp }}/govbr-auth-pytest"
          -o cache_dir="${{ runner.temp }}/govbr-auth-cache"
      - run: python -m black --check govbr_auth tests examples scripts
      - run: python -m flake8 govbr_auth tests examples scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Build distributions outside the checkout
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/source"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          python -m build --outdir "$RUNNER_TEMP/dist" "$source_dir"
      - run: python -m twine check "$RUNNER_TEMP/dist"/*
      - name: Verify the built wheel in an isolated environment
        shell: bash
        run: python scripts/verify_distribution.py "$RUNNER_TEMP/dist"/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/govbr-auth
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/dist/
