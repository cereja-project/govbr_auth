name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify release tag and production ancestry
        shell: bash
        run: |
          expected_tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify source at the released commit
        run: >-
          python -m pytest --tb=short --disable-warnings -q
          --cov=govbr_auth --cov-branch --cov-report=term-missing
          --cov-fail-under=90
          --basetemp="${{ runner.temp }}/govbr-auth-pytest"
          -o cache_dir="${{ runner.temp }}/govbr-auth-cache"
      - run: python -m black --check govbr_auth tests examples scripts
      - run: python -m flake8 govbr_auth tests examples scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the built wheel in an isolated environment
        shell: bash
        run: python scripts/verify_distribution.py dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/govbr-auth
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
