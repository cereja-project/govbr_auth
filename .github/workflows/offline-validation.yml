name: Temporary offline validation bundle

on:
  push:
    branches: [fix/browser-binding-wsgi-lifecycle]
    paths: [.github/workflows/offline-validation.yml]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Package public sources and dependency wheels for offline regression
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validation-bundle/wheels"
          git archive --format=tar HEAD > "$RUNNER_TEMP/validation-bundle/source.tar"
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/validation-bundle/wheels" -r requirements-dev.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-validation-bundle
          path: ${{ runner.temp }}/validation-bundle/
          retention-days: 1
          if-no-files-found: error
