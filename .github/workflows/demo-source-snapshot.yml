name: Temporary demo source snapshot
on:
  push:
    branches: [feat/demo-debug-explorer]
    paths: [.github/workflows/demo-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive public source for isolated validation
        run: git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: demo-source-snapshot
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
