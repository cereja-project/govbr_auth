[project]
name = "govbr-auth"
version = "1.0.0rc1"
description = "Engine de autenticação Gov.br com adapters opcionais para FastAPI, Django e Flask."
authors = [
    { name="Joab Leite", email="leitejoab@gmail.com" }
]
readme = "README.md"
license = "MIT"
keywords = ["gov.br", "autenticação", "fastapi", "django", "flask", "oauth2", "openid-connect"]
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "PyJWT>=2.13,<3",
    "cryptography",
    "python-dotenv",
    "pydantic>=2,<3"
]

[project.optional-dependencies]
fastapi = ["fastapi", "python-multipart"]
django = ["Django", "asgiref"]
flask = ["Flask", "asgiref"]
fake = ["fastapi", "python-multipart", "uvicorn"]
dev = ["uvicorn", "pytest", "pytest-asyncio", "pytest-mock", "black", "build", "flake8", "pytest-cov", "PyYAML"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["govbr_auth*"]
exclude = ["govbr_auth.__pycache__*", "govbr_auth.*.__pycache__*"]

[project.urls]
Homepage = "https://github.com/cereja-project/govbr_auth"
Repository = "https://github.com/cereja-project/govbr_auth"
Documentation = "https://govbr-auth.readthedocs.io/"
Issues = "https://github.com/cereja-project/govbr_auth/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
