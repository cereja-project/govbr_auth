# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"

python:
  version: 3.11
  install:
    - requirements: docs/requirements-docs.txt

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Optionally set the version of Python and requirements to use for building docs
# Optionally build docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub

# Build pull request previews for pull requests coming from forks
# Set to false to skip building pull request previews
build_pull_requests: true

# If using Jupyter Notebooks only convert them to RST if they are referenced
# from a standard reStructuredText file or if they are listed in the
# `formats` key.
jupyter:
  outputs: false

# Set notification for broken links
# notificationLevel: warning

# Redirect homepage to manual page
redirects:
  index.html: guide/quick-start.html

# Exclude these paths from building docs
exclude_patterns:
  - README.md

# VCS
vcs:
  fallback_to_master: true

