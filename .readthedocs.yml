# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"

python:
   install:
   - requirements: docs/requirements.txt
   - method: pip
     path: .

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Optionally set the version of Python and requirements to use for building docs
# Optionally build docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub
